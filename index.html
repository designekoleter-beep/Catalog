<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catalog</title><!-- write your website title here -->
<link href="https://fonts.googleapis.com/css2?family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
<style>
:root{--paper:#fffdf9;--gold:#f2c14e}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{position:fixed;inset:0;font-family:Georgia,serif;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
background:linear-gradient(#060a22 0%,#0f1a52 36%,#27307f 60%,#6b4c9e 80%,#d08fa6 100%)}
.au{position:fixed;left:-20%;width:140%;height:46%;pointer-events:none;opacity:.55;mix-blend-mode:screen;z-index:1;animation:drift 18s ease-in-out infinite alternate}
.a1{top:2%;background:radial-gradient(ellipse 40% 50% at 30% 50%,#27f0b0aa,#27f0b000 70%),radial-gradient(ellipse 35% 40% at 68% 40%,#6a7bff99,#6a7bff00 70%)}
.a2{top:12%;opacity:.4;animation-duration:25s;animation-direction:alternate-reverse;background:radial-gradient(ellipse 35% 45% at 55% 50%,#d27bff88,#d27bff00 70%),radial-gradient(ellipse 30% 40% at 20% 40%,#3be0ffaa,#3be0ff00 70%)}
@keyframes drift{from{transform:translateX(-6%) skewX(-6deg)}to{transform:translateX(6%) skewX(6deg) scaleY(1.15)}}
.moon{position:fixed;top:9%;right:9%;width:clamp(56px,9vw,110px);aspect-ratio:1;border-radius:50%;z-index:1;pointer-events:none;
background:radial-gradient(circle at 35% 35%,#fffdf0,#ffeeb8 60%,#f3d58a);box-shadow:0 0 40px 12px #ffe9a855,0 0 140px 60px #ffe9a822}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:2;pointer-events:none}
#bk,#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#bk{z-index:3}#fx{z-index:9}
#ttl{position:fixed;left:0;right:0;z-index:10;text-align:center;color:#ffe9a8;padding:0 12px;pointer-events:none;
font:700 clamp(24px,4.4vw,44px)/1.1 'Mountains of Christmas',Georgia,serif;text-shadow:0 0 20px #ffc86b99}
#ttl:empty{display:none}
#stage{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;justify-content:center;touch-action:none}
#book{position:relative;transform:translateX(0);transition:transform .7s cubic-bezier(.4,.1,.2,1)}
.gr{position:absolute;left:3%;right:3%;bottom:-20px;height:32px;z-index:-1;background:radial-gradient(ellipse at 50% 50%,#050a3acc 0,#050a3a00 70%);filter:blur(7px)}
#brd{position:absolute;top:-8px;height:calc(100% + 16px);border-radius:9px;background:linear-gradient(#1c2d78,#0a1240);
box-shadow:0 0 70px 6px #ffc86b44,0 14px 30px #0009,inset 0 0 0 2px #f2c14e88;transition:left .7s,width .7s}
.eg{position:absolute;top:3px;height:calc(100% - 6px);background:repeating-linear-gradient(90deg,#fffdf9 0 1px,#d6cdc0 1px 2px)}
#org{position:absolute;top:0;height:100%;width:0;perspective:2400px}
.lv{position:absolute;top:0;left:0;width:var(--pw);height:var(--ph);transform-origin:0 50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;overflow:hidden;background:var(--paper);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.f{border-radius:0 5px 5px 0}.face.b{transform:rotateY(180deg);border-radius:5px 0 0 5px}
.ph{position:absolute;inset:0}
.ph img{display:block;width:100%;height:100%;object-fit:contain;pointer-events:none;-webkit-user-drag:none}
.gut,.sh{position:absolute;inset:0;pointer-events:none}
.f .gut{background:linear-gradient(90deg,#0004,#0001 5%,#0000 13%)}
.b .gut{background:linear-gradient(270deg,#0004,#0001 5%,#0000 13%)}
.sh{opacity:0;background:linear-gradient(90deg,#0a1040aa,#0a104000)}.b .sh{background:linear-gradient(270deg,#0a1040aa,#0a104000)}
.ca{position:absolute;top:0;height:100%;z-index:500;opacity:0;pointer-events:none}
#cR{background:linear-gradient(90deg,#0a104099,#0a104000)}#cL{background:linear-gradient(270deg,#0a104099,#0a104000)}
#snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:12}
#ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:12px;
padding:6px 10px;border-radius:32px;border:2px solid var(--gold);background:linear-gradient(#1c2d78,#0a1240);color:#ffe9a8;font:700 15px/1 Georgia,serif;box-shadow:0 6px 16px #0009}
#ctl button{width:40px;height:40px;border-radius:50%;border:0;background:var(--gold);color:#0a1240;font:700 26px/1 Georgia,serif;cursor:pointer;padding-bottom:3px}
#ctl button:disabled{opacity:.35;cursor:default}#ctl button:focus-visible{outline:3px solid #fff}
#cnt{min-width:78px;text-align:center}
.sw{transform-box:fill-box;transform-origin:50% 0;animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
#sl{position:fixed;left:0;right:0;bottom:70px;height:var(--sgh,88px);overflow:hidden;z-index:4;pointer-events:none}
.sg{position:absolute;left:0;bottom:0;height:100%;width:auto;animation:run 26s linear infinite;animation-delay:-5s}
@keyframes run{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
.bob{animation:bob .5s ease-in-out infinite alternate}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-3px)}}
.lg{transform-box:fill-box;transform-origin:50% 0;animation:lg .5s ease-in-out infinite alternate}
@keyframes lg{from{transform:rotate(-28deg)}to{transform:rotate(28deg)}}
.wv{transform-box:fill-box;transform-origin:0 100%;animation:wv .6s ease-in-out infinite alternate}
@keyframes wv{from{transform:rotate(-10deg)}to{transform:rotate(14deg)}}
.up,.lo{transform-box:fill-box;transform-origin:50% 0;animation:up .5s ease-in-out infinite alternate}
.lo{animation-name:lo}
@keyframes up{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
@keyframes lo{from{transform:rotate(40deg)}to{transform:rotate(5deg)}}
.pf{transform-box:fill-box;transform-origin:50% 50%;animation:pf 1s linear infinite}
@keyframes pf{from{opacity:.9;transform:translate(0,0) scale(.5)}to{opacity:0;transform:translate(-26px,-7px) scale(1.7)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}#book,#brd{transition-duration:.01s}}
</style></head><body>
<div class="au a1"></div><div class="au a2"></div><div class="moon"></div><canvas id="sky"></canvas>
<svg id="bk"><g id="bkg"></g></svg>
<div id="sl"></div>
<h1 id="ttl"></h1><!-- write your title between the h1 tags -->
<main id="stage"><div id="book"><i class="gr"></i><i id="brd"></i><i class="eg" id="eL"></i><i class="eg" id="eR"></i>
<div id="org"><i class="ca" id="cL"></i><i class="ca" id="cR"></i></div></div></main>
<svg id="fx"><defs>
<linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6eeff"/><stop offset="1" stop-color="#8ea3de"/></linearGradient>
<linearGradient id="gF" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b9c8ff" stop-opacity="0"/><stop offset="1" stop-color="#b9c8ff" stop-opacity=".35"/></linearGradient>
<linearGradient id="gDeer" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4619"/><stop offset=".45" stop-color="#b47636"/><stop offset="1" stop-color="#e3bc88"/></linearGradient>
<linearGradient id="gRed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f2475a"/><stop offset=".5" stop-color="#d01a30"/><stop offset="1" stop-color="#8f0b20"/></linearGradient>
<linearGradient id="gSl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ea2a44"/><stop offset="1" stop-color="#9a0e25"/></linearGradient>
<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3b0"/><stop offset=".5" stop-color="#f2c14e"/><stop offset="1" stop-color="#b9770e"/></linearGradient>
<linearGradient id="gFur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#d9e1ef"/></linearGradient>
<radialGradient id="gSkin" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#ffe7d2"/><stop offset="1" stop-color="#f0b18c"/></radialGradient>
<filter id="bl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs><g id="fxg"></g></svg>
<canvas id="snow"></canvas>
<nav id="ctl"><button id="pv" aria-label="Previous page">&#8249;</button><span id="cnt"></span><button id="nx" aria-label="Next page">&#8250;</button></nav>

<!-- YOUR PHOTOS: one <img> per page, in order. The first one is the cover. -->
<!-- Add or remove lines freely. The cover is a normal page, so use your cover photo as the first line. -->
<div id="photos" hidden>
<img src="photos/Katalog festiv-01.png" alt="">
<img src="photos/Katalog festiv-02.png" alt="">
<img src="photos/Katalog festiv-03.png" alt="">
<img src="photos/Katalog festiv-04.png" alt="">
<img src="photos/Katalog festiv-05.png" alt="">
<img src="photos/Katalog festiv-06.png" alt="">
<img src="photos/Katalog festiv-07.png" alt="">
<img src="photos/Katalog festiv-08.png" alt="">
<img src="photos/Katalog festiv-09.png" alt="">
<img src="photos/Katalog festiv-11.png" alt="">
<img src="photos/Katalog festiv-12.png" alt="">
<img src="photos/foto last.png" alt="">
</div>

<script>
const RATIO=1; // page width / height. 1 = square pages, made for 38.1 x 38.1 cm photos. For other shapes use e.g. 3/4 or 4/3.
const $=s=>document.querySelector(s);
const srcs=[...document.querySelectorAll('#photos img')].map(i=>({s:i.getAttribute('src'),a:i.alt}));
const n=srcs.length,book=$('#book'),brd=$('#brd'),eR=$('#eR'),eL=$('#eL'),cR=$('#cR'),cL=$('#cL'),org=$('#org'),pv=$('#pv'),nx=$('#nx'),cnt=$('#cnt'),st=$('#stage');
let spread=false,L=0,maxK=0,k=0,pw=0,ph=0,leaves=[],g=null;

function face(i,side){
 const d=document.createElement('div');d.className='face '+side;
 if(i!=null&&i<n){const p=document.createElement('div'),im=new Image();p.className='ph';im.src=srcs[i].s;im.alt=srcs[i].a;im.draggable=false;
  im.onerror=()=>im.style.visibility='hidden';p.append(im);d.append(p);}
 d.insertAdjacentHTML('beforeend','<i class="gut"></i><i class="sh"></i>');return d;}

function build(){
 org.querySelectorAll('.lv').forEach(e=>e.remove());leaves=[];
 L=spread?Math.ceil(n/2):n;maxK=spread?(n%2?L-1:L):n-1;k=Math.max(0,Math.min(k,maxK));
 for(let i=0;i<L;i++){const e=document.createElement('div');e.className='lv';
  e.append(face(spread?2*i:i,'f'),face(spread?2*i+1:null,'b'));org.append(e);
  const l={e,i,th:i<k?180:0,busy:0};leaves.push(l);}
}
function paint(l){
 const t=l.th,s=Math.sin(t*Math.PI/180);
 l.e.style.transform=`rotateY(${-t}deg)`;
 l.e.children[0].lastChild.style.opacity=l.e.children[1].lastChild.style.opacity=s*.5;
 l.e.style.zIndex=l.busy?1000:(t>=90?l.i+1:L-l.i+1);
 l.e.style.visibility=(!spread&&t>=179.5&&!l.busy)?'hidden':'visible';
}
function cast(){
 let a=0,x=0,b=0,y=0;
 leaves.forEach(l=>{const t=l.th;if(t<.5||t>179.5)return;const r=t*Math.PI/180,c=Math.cos(r),s=Math.sin(r);
  if(t<90){if(s>a){a=s;x=pw*c}}else if(spread&&s>b){b=s;y=pw*c}});
 const w=Math.min(pw-x,pw*.5);cR.style.cssText=`left:${x}px;width:${w}px;opacity:${a}`;
 const v=Math.min(pw+y,pw*.5);cL.style.cssText=`left:${y-v}px;width:${v}px;opacity:${b}`;
}
function state(){
 const wd=v=>v>0?Math.min(7,1+v*1.6):0,W=wd(L-k),re=spread?2*pw:pw;
 eR.style.cssText=`left:${re-3}px;width:${W?W+3:0}px`;
 if(spread){const w2=wd(k);eL.style.cssText=`left:${-w2}px;width:${w2?w2+3:0}px`}else eL.style.cssText='width:0';
 const lb=spread?(k>0?-8:pw):-7,rb=spread?(k<L?2*pw+8:pw):pw+7;
 brd.style.left=lb+'px';brd.style.width=(rb-lb)+'px';
 book.style.transform=`translateX(${spread?(k==0?-pw/2:k==L?pw/2:0):0}px)`;
 pv.disabled=k<=0;nx.disabled=k>=maxK;
 cnt.textContent=(spread?(k==0?1:k==L?n:(2*k)+' \u2013 '+(2*k+1)):k+1)+' / '+n;
}
function layout(){
 const vw=innerWidth,vh=innerHeight,s=vh<520,sp=vw>=900&&!s;
 if(sp!==spread||!leaves.length){const p=spread?Math.min(2*k,n-1):k;spread=sp;k=sp?Math.ceil(p/2):p;build();}
 const base=s?58:96,t=$('#ttl');t.style.top=(base-6)+'px';
 const top=base+(t.offsetHeight?t.offsetHeight+4:0),bot=s?52:158;
 st.style.top=top+'px';st.style.bottom=bot+'px';
 const aw=vw-(spread?150:24),ah=Math.max(140,vh-top-bot-18);
 pw=Math.floor(Math.max(90,Math.min(aw/(spread?2:1),ah*RATIO)));ph=Math.floor(pw/RATIO);
 const r=document.documentElement.style;r.setProperty('--pw',pw+'px');r.setProperty('--ph',ph+'px');r.setProperty('--sgh','88px');$('#sl').style.display=s?'none':'block';
 book.style.width=(spread?2*pw:pw)+'px';book.style.height=ph+'px';
 org.style.left=(spread?pw:0)+'px';org.style.perspectiveOrigin=spread?'0 50%':(pw/2)+'px 50%';
 leaves.forEach(paint);cast();state();decor(vw,vh,s);snowInit();
}
function anim(l,to){
 l.busy=1;state();const from=l.th,dur=Math.max(240,Math.abs(to-from)/180*850),t0=performance.now();
 (function f(t){const p=Math.min(1,(t-t0)/dur),e=p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;
  l.th=p<1?from+(to-from)*e:to;if(p>=1)l.busy=0;paint(l);cast();if(p<1)requestAnimationFrame(f)})(t0);
}
function go(d){
 const f=d>0,i=f?k:k-1;if(i<0||(f&&k>=maxK))return;const l=leaves[i];if(l.busy)return;
 f?k++:k--;anim(l,f?180:0);
}
st.addEventListener('pointerdown',e=>{if(e.button>0)return;g={x:e.clientX,y:e.clientY,l:null,vx:0,lx:e.clientX,lt:performance.now()};st.setPointerCapture(e.pointerId)});
st.addEventListener('pointermove',e=>{
 if(!g)return;const dx=e.clientX-g.x,r=book.getBoundingClientRect();
 if(!g.l){if(Math.abs(dx)<8)return;
  const f=spread?g.x>r.left+r.width/2:dx<0,i=f?k:k-1;
  if(i<0||(f&&k>=maxK)||leaves[i].busy){g=null;return}
  g.l=leaves[i];g.f=f;g.l.busy=1;g.sp=r.left+(spread?pw:0);}
 const now=performance.now();if(now-g.lt>8){g.vx=(e.clientX-g.lx)/(now-g.lt);g.lx=e.clientX;g.lt=now}
 let th;
 if(spread){const edge=(g.f?g.sp+pw:g.sp-pw)+(e.clientX-g.x)*1.25;th=Math.acos(Math.max(-1,Math.min(1,(edge-g.sp)/pw)))*180/Math.PI}
 else{const u=Math.max(0,Math.min(1,(g.f?g.x-e.clientX:e.clientX-g.x)/(pw*.85)));th=g.f?u*180:180-u*180}
 g.l.th=th;paint(g.l);cast();
});
function end(e,cancel){
 if(!g)return;const q=g;g=null;
 if(!q.l){if(!cancel&&Math.abs(e.clientX-q.x)<8&&Math.abs(e.clientY-q.y)<8){const r=book.getBoundingClientRect();go(e.clientX>r.left+r.width/2?1:-1)}return}
 const l=q.l;let to;
 if(q.f){const ok=!cancel&&(l.th>70||q.vx<-.35);to=ok?180:0;if(ok)k++}
 else{const ok=!cancel&&(l.th<110||q.vx>.35);to=ok?0:180;if(ok)k--}
 anim(l,to);
}
st.addEventListener('pointerup',e=>end(e,false));
st.addEventListener('pointercancel',e=>end(e,true));
pv.onclick=()=>go(-1);nx.onclick=()=>go(1);
addEventListener('keydown',e=>{if(e.key=='ArrowRight'||e.key=='PageDown')go(1);else if(e.key=='ArrowLeft'||e.key=='PageUp')go(-1)});
let rt;addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(layout,80)});

/* ---------- winter night scenery ---------- */
function decor(vw,vh,sh){
 const fx=$('#fx'),bk=$('#bk');[fx,bk].forEach(e=>{e.setAttribute('viewBox',`0 0 ${vw} ${vh}`);e.style.cssText=`top:auto;bottom:0;width:${vw}px;height:${vh}px`});
 let r=7;const R=()=>(r=(r*16807)%2147483647)/2147483647;
 const tri=(x,yb,w,yt)=>`M${x-w/2} ${yb}L${x} ${yt}L${x+w/2} ${yb}Z`;
 const tree=(x,b,h,w)=>tri(x,b,w,b-h*.5)+tri(x,b-h*.28,w*.74,b-h*.78)+tri(x,b-h*.55,w*.5,b-h);
 const sc=Math.max(.9,Math.min(1.25,vw/900));let o='';
 [['#2f3d96',.80,.17,1],['#1d2a70',.86,.23,1.25],['#0f1848',.92,.3,1.6]].forEach(([c,b,hh,k],li)=>{
  const base=vh*b;let d='',x=-30;
  while(x<vw+40){const w=(34+R()*34)*sc*k,h=Math.min(w*(2.3+R()*1.2),vh*hh*1.4)*(sh?.7:1);d+=tree(x,base+8,h,w);x+=w*(.45+R()*.45)}
  o+=`<path d="${d}" fill="${c}"/><rect x="0" y="${base}" width="${vw}" height="${vh-base}" fill="${c}"/>`;
  if(li==0)o+=`<rect x="0" y="${base-vh*.12}" width="${vw}" height="${vh*.16}" fill="url(#gF)"/>`;
  if(li==1){const hx=vw*(vw<700?.14:.2),hs=44*sc,hy=base-2;
   o+=`<path d="M${hx} ${hy}v${-hs*.6}l${hs*.5} ${-hs*.45}l${hs*.5} ${hs*.45}v${hs*.6}z" fill="#0b1240"/><rect x="${hx+hs*.62}" y="${hy-hs*.98}" width="${hs*.12}" height="${hs*.3}" fill="#0b1240"/>`+
   `<rect x="${hx+hs*.35}" y="${hy-hs*.45}" width="${hs*.3}" height="${hs*.26}" fill="#ffb84d" filter="url(#bl)"/><rect x="${hx+hs*.35}" y="${hy-hs*.45}" width="${hs*.3}" height="${hs*.26}" fill="#ffe08a"/>`}
 });
 const dh=sh?Math.min(74,vh*.1):118;
 o+=`<path d="M0 ${vh}V${vh-dh*.6}Q${vw*.14} ${vh-dh*1.1} ${vw*.3} ${vh-dh*.7}T${vw*.6} ${vh-dh*.8}T${vw} ${vh-dh*.7}V${vh}Z" fill="url(#gS)"/>`;
 bk.querySelector('#bkg').innerHTML=o;
}

/* ---------- stars, floating golden lights, falling snow ---------- */
const cv=$('#snow'),cx=cv.getContext('2d'),sk=$('#sky'),sx=sk.getContext('2d'),still=matchMedia('(prefers-reduced-motion:reduce)').matches;
let fl=[],stars=[],orbs=[],run=false;
const spr=document.createElement('canvas');spr.width=spr.height=64;
{const c=spr.getContext('2d'),gr=c.createRadialGradient(32,32,0,32,32,32);gr.addColorStop(0,'#fff6c8');gr.addColorStop(.25,'#ffd26b');gr.addColorStop(1,'#ffb43000');c.fillStyle=gr;c.fillRect(0,0,64,64)}
function snowInit(){
 const d=Math.min(devicePixelRatio||1,2),W=innerWidth,H=innerHeight,ar=(c,f)=>Array.from({length:c},f);
 [cv,sk].forEach(c=>{c.width=W*d;c.height=H*d;c.getContext('2d').setTransform(d,0,0,d,0,0)});
 fl=ar(Math.max(50,Math.min(150,W*H/9000|0)),()=>({x:Math.random()*W,y:Math.random()*H,r:.8+Math.random()*3.2,s:.3+Math.random()*1.1,p:Math.random()*6.3,a:.4+Math.random()*.55}));
 stars=ar(Math.round(W*H/5500),()=>({x:Math.random()*W,y:Math.random()*H*.62,r:.4+Math.random()*1.3,p:Math.random()*6.3}));
 orbs=ar(W<700?9:16,()=>({x:Math.random()*W,y:Math.random()*H,z:14+Math.random()*34,s:.12+Math.random()*.3,p:Math.random()*6.3}));
 if(!run){run=true;requestAnimationFrame(frame)}
}
function frame(t){
 const W=innerWidth,H=innerHeight;sx.clearRect(0,0,W,H);cx.clearRect(0,0,W,H);sx.fillStyle='#fff';
 for(const s of stars){sx.globalAlpha=.3+.7*Math.abs(Math.sin(t/900+s.p*3));sx.beginPath();sx.arc(s.x,s.y,s.r,0,6.3);sx.fill()}
 for(const o of orbs){if(!still){o.y-=o.s;o.x+=Math.sin(t/2200+o.p)*.25;if(o.y<-50){o.y=H+50;o.x=Math.random()*W}}
  sx.globalAlpha=.3+.45*Math.abs(Math.sin(t/1700+o.p));sx.drawImage(spr,o.x-o.z/2,o.y-o.z/2,o.z,o.z)}
 cx.fillStyle='#fff';
 for(const f of fl){if(!still){f.y+=f.s*(.6+f.r*.25);f.x+=Math.sin(t/1500+f.p)*.35;if(f.y>H+5){f.y=-5;f.x=Math.random()*W}}
  cx.globalAlpha=f.a;cx.beginPath();cx.arc(f.x,f.y,f.r,0,6.3);cx.fill()}
